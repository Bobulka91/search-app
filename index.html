<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search App – vyhledávač</title>
<style>
    :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --accent: #0ea5a4;
        --accent-dark: #0c8786;
        --bg: #f3f4f6;
        --text: #1f2937;
        --muted: #6b7280;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 50px;
        color: var(--text);
    }

    .search-container {
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        width: 100%;
        max-width: 500px;
        text-align: center;
    }

    h1 {
        color: var(--text);
        font-size: 22px;
        margin-bottom: 25px;
    }

    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }

    input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 24px;
        outline: none;
        transition: 0.2s;
        font-size: 15px;
    }
    input:focus { border-color: var(--primary); }

    button {
        padding: 10px 22px;
        border: none;
        border-radius: 24px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn-search { background: var(--primary); color: white; }
    .btn-search:hover { background: var(--primary-dark); }

    #downloadArea {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid #eee;
        display: none;
    }

    select {
        padding: 10px 14px;
        border-radius: 20px;
        border: 2px solid #e5e7eb;
        outline: none;
        margin-bottom: 12px;
        font-size: 14px;
        color: var(--text);
    }
    select:focus { border-color: var(--accent); }

    .btn-download { background: var(--accent); color: white; width: 100%; }
    .btn-download:hover { background: var(--accent-dark); }

    #results { margin-top: 24px; width: 100%; max-width: 500px; }

    .result-item {
        background: white;
        padding: 16px;
        margin-bottom: 10px;
        border-radius: 10px;
        border-left: 4px solid var(--primary);
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        text-align: left;
    }
    .result-item a { color: var(--primary); }
</style>
</head>
<body>

    <div class="search-container">
        <h1>🔎 Co tě dnes zajímá?</h1>
        <div class="input-group">
            <input type="text" id="query" placeholder="Zadej klíčové slovo...">
            <button class="btn-search" onclick="handleSearch()">Hledej</button>
        </div>

        <div id="downloadArea">
            <p style="font-size: 14px; margin-bottom: 10px; color: #666;">Výsledky jsou připraveny k uložení:</p>
            <select id="formatSelect">
                <option value="json">Formát JSON </option>
                <option value="csv">Formát CSV </option>
            </select>
            <button class="btn-download" onclick="univerzalniStahovani()">
                💾 Stáhnout výsledky
            </button>
        </div>
    </div>

    <div id="results"></div>

    <script>
        let currentData = null;
        let lastQuery = "";

        async function handleSearch() {
            const query = document.getElementById('query').value;
            const resDiv = document.getElementById('results');
            const dlArea = document.getElementById('downloadArea');

            if (!query) {
                alert('Musíš něco napsat!');
                return;
            }

            lastQuery = query;
            resDiv.innerHTML = '<p>Pracuji na tom, momentík...</p>';
            dlArea.style.display = 'none';

            try {
                const response = await fetch('/search?q=' + encodeURIComponent(query));
                currentData = await response.json(); // Server vrací pole [{title, link}, ...]

                resDiv.innerHTML = '';
                
                if (Array.isArray(currentData) && currentData.length > 0) {
                    resDiv.innerHTML = `<h3>Nalezeno výsledků: ${currentData.length}</h3>`;
                    currentData.forEach((item, index) => {
                        resDiv.innerHTML += `
                            <div class="result-item">
                                <strong>${index + 1}. ${item.title}</strong><br>
                                <a href="${item.link}" target="_blank" style="font-size: 12px; color: #1a73e8;">${item.link}</a>
                            </div>`;
                    });
                    dlArea.style.display = 'block';
                } else {
                    resDiv.innerHTML = '<p>Bohužel nic nenalezeno. Zkus jiné slovo.</p>';
                }
            } catch (err) {
                resDiv.innerHTML = '<p style="color:red;">Chyba při komunikaci se serverem.</p>';
                console.error(err);
            }
        }

        function univerzalniStahovani() {
            if (!currentData) return;
            const format = document.getElementById('formatSelect').value;

            if (format === 'json') {
                const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: 'application/json' });
                stahniBlob(blob, `vysledky_${lastQuery}.json`);
            } else {
                let csvContent = "\uFEFFID;Nadpis;Odkaz\n"; 
                currentData.forEach((item, index) => {
                    csvContent += `${index + 1};"${item.title.replace(/"/g, '""')}";"${item.link}"\n`;
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                stahniBlob(blob, `vysledky_${lastQuery}.csv`);
            }
        }

        function stahniBlob(blob, nazevSouboru) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nazevSouboru;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
